name: trade_pulse_mobile
description: "Cross-platform Flutter stock trading simulator for Android and iOS"
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.0.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  cupertino_icons: ^1.0.6
  http: ^1.2.0
  provider: ^6.1.1
  fl_chart: ^0.66.2
  shared_preferences: ^2.2.2
  sqflite: ^2.3.3+1
  path: ^1.9.0
  intl: ^0.20.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
