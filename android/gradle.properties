org.gradle.jvmargs=-Xmx4G -XX:MaxMetaspaceSize=1G -XX:+HeapDumpOnOutOfMemoryError
android.useAndroidX=true
android.enableJetifier=true

# Disable Kotlin incremental compilation to avoid cross-drive path relativization errors on Windows:
# "IllegalArgumentException: this and base files have different roots: D:\... and C:\..."
kotlin.incremental=false
kotlin.incremental.android=false
kotlin.incremental.multiplatform=false
kotlin.incremental.java=false
# This builtInKotlin flag was added automatically by Flutter migrator
android.builtInKotlin=false
# This newDsl flag was added automatically by Flutter migrator
android.newDsl=false
